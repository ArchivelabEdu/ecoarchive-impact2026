{% extends "base.html" %}{% block body %}
<div class="crumb">사진 아카이브</div><h1>작품사진 {{ '{:,}'.format(PH.n) }}건</h1>
<p class="lead">환경사진아카이브와 연동되는 '기록-작품사진' 유형입니다. 촬영지 98.6%, 촬영연도 96.8%가 기재되어 있고 93.1%에 이용 라이선스가 명시되어 있습니다.</p>
<div class="grid g2">
  <div class="card"><p class="chart-title">촬영 연도</p><div id="c_y" class="chart short"></div></div>
  <div class="card"><p class="chart-title">라이선스</p><div id="c_l" class="chart short"></div></div>
  <div class="card"><p class="chart-title">촬영지 (시도)</p><div id="c_r" class="chart short"></div></div>
  <div class="card"><p class="chart-title">촬영 월</p><div id="c_m" class="chart short"></div></div>
  <div class="card"><p class="chart-title">작가별 작품 수 (상위 40)</p><div id="c_a" class="chart xtall"></div></div>
  <div class="card"><p class="chart-title">작품 키워드 상위 40</p><div id="c_k" class="chart xtall"></div></div>
</div>
{% endblock %}{% block script %}<script>
const PH={{ PH|tojson }};const ORDER=["서울","경기","인천","강원","충북","충남","대전","세종","전북","전남","광주","경북","경남","대구","울산","부산","제주"];
vbar("c_y",PH.year.filter(d=>d.k>=1970),{color:"#e9c46a"});donut("c_l",PH.lic.map(d=>({k:d.k.replace(/\(.*\)/,""),v:d.v})));
(function(){const m={};PH.regions.forEach(d=>m[d.k]=d.v);vbar("c_r",ORDER.map(k=>({k,v:m[k]||0})),{});})();
vbar("c_m",PH.month.sort((a,b)=>a.k-b.k).map(d=>({k:d.k+"월",v:d.v})),{color:"#8ab17d"});
hbar("c_a",PH.artists.slice(0,40).map(d=>({k:`${d.k} (${d.ymin||''}–${d.ymax||''})`,v:d.v})),{left:170});hbar("c_k",PH.kw,{left:130,color:()=>"#8ab17d"});
</script>{% endblock %}
