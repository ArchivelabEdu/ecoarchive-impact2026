<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><title>타임라인 끼워 넣기 · 풀숲 보드게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="games.css">
<style>
.line{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:12px 6px;background:#fff;border:3px solid #111;box-shadow:6px 6px 0 #111;min-height:150px}
.slot{flex:0 0 26px;display:flex;align-items:center;justify-content:center}.slot button{width:26px;height:80px;border:2px dashed #111;background:var(--y);color:#111;font-weight:900;cursor:pointer;border-radius:0}.slot button:hover{background:#111;color:var(--y)}.slot button:disabled{opacity:.35;cursor:default}
.tcard{flex:0 0 150px;border:3px solid #111;padding:8px;background:#fff;font-size:.86rem;position:relative}
.tcard .y{font-weight:900;background:#111;color:var(--y);display:inline-block;padding:0 6px;font-size:.95rem}.tcard .t{font-weight:700;min-height:2.6em}.tcard img{height:70px;object-fit:cover;margin-bottom:6px;border:2px solid #111}
.tcard.new{animation:pop .4s}.tcard.bad{background:var(--bad)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.hand{margin-top:16px}.hcard{display:inline-block;vertical-align:top;width:170px;margin:8px;border:3px solid #111;padding:10px;background:#fff;cursor:pointer;font-size:.9rem;box-shadow:4px 4px 0 #111}
.hcard.sel{background:var(--b);transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}.hcard .k{font-size:.75rem;color:var(--muted)}.hcard img{height:80px;object-fit:cover;width:100%;border:2px solid #111;margin-bottom:6px}
</style></head><body>
<div class="top"><a href="index.html">‹ 게임 목록</a><h1>② 타임라인 끼워 넣기</h1><span class="sc" id="score"></span></div>
<div class="wrap">
<p class="note">손패에서 카드를 고른 뒤, 줄에서 그 카드가 들어갈 자리의 <b>+</b>를 누르세요. 연도 순서가 맞으면 줄에 남고, 틀리면 카드가 사라집니다. 손패를 다 쓰면 끝. 줄에 남긴 카드 수가 점수입니다.</p>
<div class="line" id="line"></div>
<div class="hand"><div class="note">손패 <span id="handN"></span> — 카드를 클릭해 선택</div><div id="hand"></div></div>
<div class="result" id="result" hidden></div>
<p style="margin-top:14px"><button class="btn ghost" onclick="start()">다시 시작</button> <label class="note">덱: <select id="deck"><option value="event">사건</option><option value="org">단체 설립</option><option value="mix" selected>사건+단체</option></select></label> <label class="note">손패 <select id="n"><option>5</option><option selected>7</option><option>10</option></select>장</label></p>
</div>
<script src="common.js"></script><script>
let ALL=[],line=[],hand=[],sel=null,placed=0,lost=0;
function card(c,cls){return `<div class="${cls}"><div class="k">${c.type==="event"?"사건":"단체 설립"}</div>${c.image?`<img src="${c.image}" alt="">`:""}<div class="t">${esc(c.front)}</div></div>`}
function render(){const L=document.getElementById("line");let h="";h+=`<div class="slot"><button onclick="place(0)">+</button></div>`;
 line.forEach((c,i)=>{h+=`<div class="tcard ${c._new?'new':''}">${c.image?`<img src="${c.image}" alt="">`:""}<div class="y">${c.year}</div><div class="t">${esc(c.front)}</div></div><div class="slot"><button onclick="place(${i+1})">+</button></div>`;c._new=false;});
 L.innerHTML=h;document.querySelectorAll(".slot button").forEach(b=>b.disabled=!sel);
 document.getElementById("hand").innerHTML=hand.map((c,i)=>`<div class="hcard ${sel===i?'sel':''}" onclick="sel=${i};render()">${card(c,'')}</div>`).join("");
 document.getElementById("handN").textContent=hand.length+"장";document.getElementById("score").textContent=`줄에 남긴 카드 ${placed} · 버린 카드 ${lost}`;
 if(!hand.length&&line.length){const r=document.getElementById("result");r.hidden=false;r.innerHTML=`<b>끝!</b> 줄에 남긴 카드 ${placed}장, 틀린 카드 ${lost}장.<br><span class="note">줄의 카드는 왼쪽부터 ${line[0].year}년 → ${line[line.length-1].year}년. 각 사건은 풀숲 사건 페이지에서 볼 수 있습니다.</span><div style="margin-top:8px">${line.map(c=>`<a class="tag" href="${c.url}" target="_blank">${c.year} ${esc(c.front)}</a>`).join("")}</div>`;}}
function place(pos){if(sel===null)return;const c=hand[sel];const prev=line[pos-1],next=line[pos];const ok=(!prev||prev.year<=c.year)&&(!next||c.year<=next.year);
 hand.splice(sel,1);sel=null;
 if(ok){c._new=true;line.splice(pos,0,c);placed++;flash(`맞았습니다! ${c.front}은(는) ${c.year}년.`,true);}else{lost++;flash(`아쉽습니다. ${c.front}은(는) ${c.year}년입니다.`,false);}
 render();}
function flash(t,ok){const r=document.getElementById("result");r.hidden=false;r.innerHTML=`<div class="msg ${ok?'ok':'bad'}">${t}</div>`;}
function start(){const d=document.getElementById("deck").value,n=+document.getElementById("n").value;let pool=ALL.filter(c=>c.year&&(d==="mix"?(c.type==="event"||c.type==="org"):c.type===d));
 const cards=pick(pool,n+1);line=[cards[0]];hand=cards.slice(1);sel=null;placed=0;lost=0;document.getElementById("result").hidden=true;render();}
loadCards().then(c=>{ALL=c;start();});
</script></body></html>
