<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><title>누구일까요 · 풀숲 보드게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="games.css">
<style>
.stage{display:grid;grid-template-columns:200px 1fr;gap:16px}@media(max-width:640px){.stage{grid-template-columns:1fr}}
.portrait{aspect-ratio:1;border-radius:14px;background:#dfe7e1;display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(.6);transition:filter .6s}.portrait.reveal img{filter:none}
.hints{list-style:none;padding:0;margin:0}.hints li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.hints li.locked{color:var(--muted);background:#f6f8f6;border-style:dashed}
.pts{font-size:2rem;font-weight:800;color:var(--g)}
</style></head><body>
<div class="top"><a href="index.html">‹ 게임 목록</a><h1>② 누구일까요</h1><span class="sc" id="score"></span></div>
<div class="wrap">
<p class="note">힌트가 하나씩 열립니다. 빨리 맞힐수록 점수가 높습니다(힌트 1개에 40점, 2개 30점, 3개 20점, 4개 10점). 10문제.</p>
<div class="stage"><div><div class="portrait" id="portrait"></div><div class="note" style="margin-top:6px" id="role"></div></div>
<div><div class="pts" id="pts">40점</div><ul class="hints" id="hints"></ul><button class="btn ghost" id="more" onclick="more()">힌트 더 보기</button>
<div class="opts" id="opts"></div><div id="msg"></div><button class="btn" id="next" onclick="next()" hidden>다음 문제 ›</button></div></div>
<div class="result" id="result" hidden></div>
<p style="margin-top:14px"><label class="note">덱: <select id="deck" onchange="start()"><option value="person">인물(사진작가·기증자)</option><option value="org">단체</option><option value="both" selected>인물+단체</option></select></label></p>
</div>
<script src="common.js"></script><script>
let ALL=[],q=[],i=0,shown=1,score=0,done=false;
function cur(){return q[i]}
function render(){const c=cur();const p=document.getElementById("portrait");p.className="portrait";p.innerHTML=c.image?`<img src="${c.image}" alt="">`:(c.type==="org"?"🏛️":"👤");
 document.getElementById("role").textContent=c.type==="org"?"환경단체":c.role;
 document.getElementById("hints").innerHTML=c.hints.map((h,k)=>`<li class="${k<shown?'':'locked'}">${k<shown?esc(h):"힌트 "+(k+1)+" (잠김)"}</li>`).join("");
 document.getElementById("pts").textContent=[40,30,20,10][Math.min(shown-1,3)]+"점";document.getElementById("more").disabled=shown>=c.hints.length||done;
 const wrong=pick(ALL.filter(x=>x.type===c.type&&x.front!==c.front),3);const opts=shuffle([c,...wrong]);
 if(!done)document.getElementById("opts").innerHTML=opts.map(o=>`<button class="opt" onclick="answer(this,'${esc(o.front)}')">${esc(o.front)}</button>`).join("");
 document.getElementById("score").textContent=`${i+1}/${q.length} · ${score}점`;}
function more(){shown++;render();}
function answer(btn,name){if(done)return;done=true;const c=cur();const ok=name===c.front;const pts=ok?[40,30,20,10][Math.min(shown-1,3)]:0;score+=pts;
 document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===c.front)b.classList.add("ok");else if(b===btn)b.classList.add("bad");b.disabled=true;});
 document.getElementById("portrait").classList.add("reveal");shown=c.hints.length;
 document.getElementById("hints").innerHTML=c.hints.map(h=>`<li>${esc(h)}</li>`).join("");
 document.getElementById("msg").innerHTML=`<div class="msg ${ok?'ok':'bad'}">${ok?`정답! +${pts}점`:`아쉽습니다. 정답은 ${esc(c.front)}`}</div><div class="note">${esc(c.back||"")}</div><a class="tag" href="${c.url}" target="_blank">풀숲에서 보기 ↗</a>`;
 document.getElementById("next").hidden=false;document.getElementById("score").textContent=`${i+1}/${q.length} · ${score}점`;}
function next(){i++;if(i>=q.length){document.getElementById("result").hidden=false;document.getElementById("result").innerHTML=`<b>끝!</b> 총 ${score}점 / ${q.length*40}점 <button class="btn" onclick="start()">다시</button>`;return;}shown=1;done=false;document.getElementById("msg").innerHTML="";document.getElementById("next").hidden=true;render();}
function start(){const d=document.getElementById("deck").value;const pool=ALL.filter(c=>(d==="both"?(c.type==="person"||c.type==="org"):c.type===d)&&c.hints&&c.hints.length>=2);
 q=pick(pool,10);i=0;shown=1;score=0;done=false;document.getElementById("result").hidden=true;document.getElementById("msg").innerHTML="";document.getElementById("next").hidden=true;render();}
loadCards().then(c=>{ALL=c;start();});
</script></body></html>
